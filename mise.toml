[tools]
node = "24"
pnpm = "12"
python = "3.14"

[tasks.test]
description = "Test game rules, telemetry parsing and safe installation"
run = ["pnpm test", "python3 -m unittest discover -s tests -p 'test_*.py'"]

[tasks.check]
description = "Check every native UI role in isolated fixtures"
run = "python3 scripts/check.py"

[tasks.install]
description = "Install new layout files without changing the current layout"
run = "python3 scripts/install.py"

[tasks.update]
description = "Back up and update only this layout's installed files"
run = "python3 scripts/install.py --update"

[tasks.verify]
description = "Run pure tests and native validation"
depends = ["test", "check"]
